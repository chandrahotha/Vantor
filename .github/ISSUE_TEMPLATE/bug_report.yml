name: Bug Report
description: Report a reproducible defect in Vantor
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in Vantor. Please ensure this is not a security vulnerability. For security vulnerabilities, follow the private reporting instructions in [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Start services with `docker compose up -d`
        2. Execute API request or navigate to page...
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen according to domain specifications or documentation.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component Affected
      options:
        - Backend API
        - Frontend Web
        - Worker / Scheduler
        - Database Migrations / RLS
        - Auth / Keycloak
        - Documentation / Scripts
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Error Output
      description: Relevant server, client, or terminal logs.
      render: shell
