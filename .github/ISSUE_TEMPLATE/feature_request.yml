name: Feature Request
description: Propose a new feature, integration, or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature proposals should align with Vantor's procurement architecture, tenant-isolation model, and immutable audit trail principles.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What procurement challenge or workflow limitation does this address?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or technical implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative implementations or existing patterns considered.
  - type: dropdown
    id: target_area
    attributes:
      label: Target Subsystem
      options:
        - Supplier Management / Scorecards
        - Sourcing / RFQ / Auction
        - Contracting / E-Sign
        - Purchasing / 3-Way Matching
        - Spend Intelligence / Analytics
        - AI Copilot / Grounding
        - Integration / Webhooks
        - Core Platform / Multi-tenancy
    validations:
      required: true
