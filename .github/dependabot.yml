version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    groups:
      python-security:
        applies-to: version-updates
        patterns: ["cryptography", "pyjwt", "python-multipart", "httpx", "urllib3", "requests", "jinja2", "aiohttp", "starlette"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: [dependencies, python]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: [dependencies, python]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    groups:
      # Next.js majors pull React + type changes with them — one reviewable PR, not six.
      next-major:
        applies-to: version-updates
        patterns: ["next"]
        update-types: [minor, patch]
      react-stack:
        applies-to: version-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
