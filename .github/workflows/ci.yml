name: ci

# CI/CD Policy:
# 1. Fully active for public repository: triggers on every push and pull_request to main,
#    as well as scheduled cadence (Mondays 05:17 UTC) and manual workflow_dispatch.
# 2. Complete verification pipeline: secret scanning -> config validation -> docs verification ->
#    typecheck -> lint -> critical tests (pytest + vitest) -> production Next.js build.
# 3. Expansion paths (PostgreSQL containers, Alembic migration verification, Playwright E2E)
#    are modularized and run via workflow_dispatch with full_suite=true.
# 4. Local verification is available via `powershell scripts/verify_all.ps1` or `bash scripts/verify_all.sh`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC (~4 runs/month)
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run full suite including heavy service containers (Postgres/Redis/E2E)"
        type: boolean
        default: false

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Cadence check
        run: |
          event="${{ github.event_name }}"
          case "$event" in
            push|pull_request|schedule|workflow_dispatch) echo "cadence OK ($event)";;
            *) echo "unexpected event: $event"; exit 1;;
          esac

  guard:
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret guard (tracked files only)
        run: python scripts/check_secrets.py
      - name: Validate compose and environment template
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-not-a-real-secret
          APP_DB_PASSWORD: ci-not-a-real-secret
          REDIS_PASSWORD: ci-not-a-real-secret
          KEYCLOAK_ADMIN_PASSWORD: ci-not-a-real-secret
          SERVICE_CLIENT_SECRET: ci-not-a-real-secret
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci-not-a-real-secret
        run: |
          test -f .env.example
          grep -q SERVICE_CLIENT_SECRET .env.example
          docker compose config > /dev/null
      - name: Images are digest-pinned
        run: python scripts/pin_digests.py --check

  docs:
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required documentation present
        run: |
          for f in README.md LICENSE SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md CHANGELOG.md .env.example docker-compose.yml mkdocs.yml docs/BRAIN.md docs/README.md docs/glossary.md docs/00-plan/ROADMAP.md docs/00-plan/REPOSITORY_AUDIT.md docs/00-plan/MIGRATION_PLAN.md docs/00-plan/BUGS.md docs/00-plan/SCORECARD.md; do test -f "$f" || (echo "missing $f" && exit 1); done
          echo "docs gate OK"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Brain-link check
        run: python scripts/verify_brain_links.py
      - name: Encoding check
        run: python scripts/check_mojibake.py
      - name: Install dependencies for doc-count verification
        run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Documentation counts match code reality
        run: python scripts/doc_counts.py --check

  backend:
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies and linters
        run: |
          pip install -r backend/requirements.txt
          pip install ruff mypy
      - name: Backend lint (Ruff)
        run: cd backend && ruff check app tests alembic
      - name: Backend typecheck (Mypy)
        run: cd backend && mypy app
      - name: Palette contrast and token audit
        run: cd frontend && python check_palette_layer.py
      - name: Migration chain is linear
        run: python scripts/audit_migrations.py
      - name: Critical unit tests (tenant-isolation, auth, money, audit chain)
        env:
          APP_ENV: test
          DATABASE_URL: sqlite://
          OIDC_ISSUER: https://issuer.test/realms/vantor
          JWT_AUDIENCE: vantor-web
        run: python -m pytest backend/tests -q
      - name: API contract synchronization (OpenAPI matches committed copy)
        run: |
          cd backend
          APP_ENV=test DATABASE_URL=sqlite:// python -c "from app.main import app; import json; json.dump(app.openapi(), open('../api/openapi.json','w'), indent=2)"
          test -f ../api/openapi.json
          cd ..
          git diff --exit-code -- api/openapi.json || (echo "api/openapi.json is stale - regenerate and commit" && exit 1)

  worker:
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install worker dependencies
        run: |
          pip install -r worker/requirements.txt
          pip install pytest ruff
      - name: Worker lint
        run: cd worker && ruff check .
      - name: Worker unit tests
        run: cd worker && python -m pytest tests -q

  frontend:
    needs: policy
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: vantor
      NEXT_PUBLIC_KEYCLOAK_CLIENT: vantor-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend unit/component tests
        working-directory: frontend
        run: npm test
      - name: Production build (Next.js)
        working-directory: frontend
        run: npm run build

  # =========================================================================
  # Heavy Expansion Tier (Enabled via workflow_dispatch with full_suite=true,
  # or un-commented when moving to full-scale PR/commit CI in a later phase)
  # =========================================================================
  postgres-tier:
    needs: [backend]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_suite == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vantor
          POSTGRES_PASSWORD: vantor-test
          POSTGRES_DB: vantor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vantor"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Alembic baseline check on real Postgres
        env:
          DATABASE_URL: postgresql://vantor:vantor-test@localhost:5432/vantor_test
          APP_DB_PASSWORD: ci-app-role-test-pw
        run: |
          cd backend
          alembic upgrade head
          alembic check
          alembic downgrade -1
          alembic upgrade head
      - name: Postgres-backed tests (concurrency, RLS, FKs)
        env:
          APP_ENV: test
          PG_TEST_DATABASE_URL: postgresql://vantor:vantor-test@localhost:5432/vantor_test
          APP_DB_PASSWORD: ci-app-role-test-pw
          OIDC_ISSUER: https://issuer.test/realms/vantor
          JWT_AUDIENCE: vantor-web
        run: cd backend && python -m pytest -m pg -q

  e2e-tier:
    needs: [frontend, backend]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_suite == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Start API server in local mode
        env:
          APP_ENV: development
          AUTH_MODE: local
          DATABASE_URL: "sqlite:///./data/ci_e2e.db"
          LOCAL_KEY_PATH: "./data/ci_e2e_key.pem"
        run: |
          cd backend
          mkdir -p data
          nohup python -m uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/v1/health || (cat /tmp/backend.log && exit 1)
      - name: Install Playwright browsers and run E2E
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          NEXT_PUBLIC_API_URL=http://localhost:8000 npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
