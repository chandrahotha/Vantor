name: ci

# CI runs on every push and PR, plus the weekly run and manual dispatch. That is
# what a merge gate means: the checks must green before anything lands on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC (~4 runs/month)
  workflow_dispatch: {} # manual: gh workflow run ci

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Cadence — push/PR/weekly/dispatch, no commits on schedule
        run: |
          event="${{ github.event_name }}"
          case "$event" in
            push|pull_request|schedule|workflow_dispatch) echo "cadence OK ($event)";;
            *) echo "unexpected event: $event"; exit 1;;
          esac
  guard:
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret guard (tracked files only; cannot match its own source)
        # scripts/check_secrets.py self-tests AND scans tracked files only. The
        # inline version this replaced matched its own literal pattern in ci.yml
        # and had been failing on every run — no one saw it because CI was weekly.
        run: python scripts/check_secrets.py
      - name: Validate compose + env example
        # VNT-034/035: compose now uses `${VAR:?message}` for every secret, which
        # means it refuses to render without them — that is the point, and it also
        # means CI has to supply throwaway values to validate the file at all.
        # `docker compose config` is a parse-and-interpolate check, so these never
        # leave the runner.
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-not-a-real-secret
          REDIS_PASSWORD: ci-not-a-real-secret
          KEYCLOAK_ADMIN_PASSWORD: ci-not-a-real-secret
          SERVICE_CLIENT_SECRET: ci-not-a-real-secret
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci-not-a-real-secret
        run: |
          test -f .env.example
          grep -q SERVICE_CLIENT_SECRET .env.example
          docker compose config > /dev/null
      - name: Images are digest-pinned (offline structural gate)
        # Catches a service reverted to a mutable tag, which is the thing that
        # makes two runs of the same commit differ. Needs no network and no .env.
        run: python scripts/pin_digests.py --check
  docs:
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required docs present
        run: |
          for f in README.md LICENSE SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md CHANGELOG.md .env.example docker-compose.yml mkdocs.yml docs/BRAIN.md docs/README.md docs/glossary.md docs/00-plan/ROADMAP.md docs/00-plan/REPOSITORY_AUDIT.md docs/00-plan/MIGRATION_PLAN.md docs/00-plan/BUGS.md docs/00-plan/SCORECARD.md; do test -f "$f" || (echo "missing $f" && exit 1); done
          echo "docs gate OK"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Brain-link check (every doc links to BRAIN.md)
        run: python scripts/verify_brain_links.py
      - name: Encoding check (no mojibake in tracked text)
        run: python scripts/check_mojibake.py
      - name: Documentation counts match the code
        # VNT-042. The READMEs asserted hand-written numbers that had drifted into
        # contradicting each other - three files, three different answers, none of
        # them true. A count in prose decays silently; this fails on the push that
        # changes reality, instead of waiting for a reader to notice.
        run: python scripts/doc_counts.py --check
  backend:
    needs: policy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vantor
          POSTGRES_PASSWORD: vantor-test
          POSTGRES_DB: vantor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vantor"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend deps
        run: |
          pip install -r backend/requirements.txt
          pip install ruff
      - name: Backend lint
        # VNT-040: the backend was never linted. Turning this on found two real
        # production bugs that 296 tests had missed - an undefined name on the
        # IP-literal webhook path, and the streaming AI path never passing the
        # tool grounding the response then cited. The selected rules are the
        # defect-detecting ones only; see backend/ruff.toml for what is
        # deliberately excluded and why.
        run: cd backend && ruff check app tests alembic
      - name: Palette contrast + cycle audit
        # Two things no typechecker and no browser test in this suite can see:
        # a custom-property cycle (invalid at computed-value time, so a token
        # silently inherits its root default) and a text/background pair below
        # WCAG AA. Both are checked for all five palettes in both modes.
        run: cd frontend && python check_palette_layer.py
      - name: Migration chain is linear with one head
        # Catches a duplicated revision, a broken down_revision link, or a
        # migration missing an upgrade()/downgrade(). Offline: the PostgreSQL
        # effects are covered by the alembic step below, which needs a real
        # database.
        run: python scripts/audit_migrations.py
      - name: Unit gates (tenant-isolation + auth + audit chain)
        env:
          APP_ENV: test
          DATABASE_URL: sqlite://
          OIDC_ISSUER: https://issuer.test/realms/vantor
          JWT_AUDIENCE: vantor-web
        run: python -m pytest backend/tests -q
      - name: Alembic baseline check (PG)
        env:
          DATABASE_URL: postgresql://vantor:vantor-test@localhost:5432/vantor_test
        run: |
          cd backend
          alembic upgrade head
          alembic check
          alembic downgrade -1
          alembic upgrade head
      - name: Postgres-backed tier (the only tests that run Alembic + FKs + RLS)
        env:
          APP_ENV: test
          PG_TEST_DATABASE_URL: postgresql://vantor:vantor-test@localhost:5432/vantor_test
          OIDC_ISSUER: https://issuer.test/realms/vantor
          JWT_AUDIENCE: vantor-web
        run: cd backend && python -m pytest tests/test_pg_infrastructure.py -q
      - name: API contract export (OpenAPI must generate and match the committed copy)
        run: |
          cd backend
          APP_ENV=test DATABASE_URL=sqlite:// python -c "from app.main import app; import json; json.dump(app.openapi(), open('../api/openapi.json','w'), indent=2)"
          test -f ../api/openapi.json
          cd ..
          git diff --exit-code -- api/openapi.json \
            || (echo "api/openapi.json is stale — commit the regenerated contract" && exit 1)
  frontend:
    needs: policy
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: vantor
      NEXT_PUBLIC_KEYCLOAK_CLIENT: vantor-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + typecheck + lint + test + build (Next.js, real data only)
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Frontend container builds
        run: docker build ./frontend
  dependabot-audit:
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Vulnerability scan (pip)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict
          pip-audit -r worker/requirements.txt --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vulnerability scan (npm)
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
