name: ci

# CI/CD Policy:
# 1. Fully active for public repository: triggers on every push and pull_request to main,
#    as well as scheduled cadence (Mondays 05:17 UTC) and manual workflow_dispatch.
# 2. Complete verification pipeline: secret scanning -> config validation -> docs verification ->
#    typecheck -> lint -> critical tests (pytest + vitest) -> production Next.js build.
# 3. Expansion paths (PostgreSQL containers, Alembic migration verification, Playwright E2E)
#    are modularized and run via workflow_dispatch with full_suite=true.
# 4. Local verification is available via `powershell scripts/verify_all.ps1` or `bash scripts/verify_all.sh`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC (~4 runs/month)
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run full suite including heavy service containers (Postgres/Redis/E2E)"
        type: boolean
        default: false

# Least privilege: jobs only read the repo unless a job explicitly widens scope.
permissions:
  contents: read

# Cancel superseded runs on the same ref so stale commits don't burn minutes.
#
# Keyed on the ref alone, this also caught the weekly full-suite run: a schedule
# and a push both run under refs/heads/main, so any push that Monday could
# cancel the one run that exercises Postgres RLS, the migration chain and the
# Playwright flows — and a cancelled run leaves no red badge to notice. The
# heavy runs get their own group and are never cancelled; superseded pushes still
# cancel each other, which is what this was for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.full_suite == 'true')) && 'full' || 'fast' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.full_suite == 'true') }}

jobs:
  policy:
    runs-on: ubuntu-latest
    # Bounded so a wedged service container fails the job in minutes instead
    # of eating GitHub's 360-minute default and reading as "still running".
    timeout-minutes: 5
    steps:
      - name: Cadence and ref policy
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          FULL_SUITE: ${{ github.event.inputs.full_suite }}
        run: |
          # This job used to compare $EVENT against the four names in this file's
          # own `on:` block. That cannot fail: every run that exists was, by
          # construction, triggered by one of them. Seven jobs say `needs:
          # policy`, so the root gate was decorative while still printing a check
          # that reads like a policy was evaluated.
          #
          # What it does instead is enforce the policy the README states — CI runs
          # on pushes and pull requests *to main*, and the weekly schedule is the
          # run that certifies main. Those are the automated events whose badges
          # people cite, so an automated event off a stale or unexpected ref is a
          # failure.
          #
          # `workflow_dispatch` is deliberately allowed on any ref, and told to
          # say so in the log: dispatching the heavy tiers against a branch is how
          # a branch gets its Postgres evidence *before* merging, which is the
          # thing that caught the never-run tiers the first time. Refusing it
          # would push people to merge untested code just to get a real test run.
          case "$EVENT" in
            push)
              if [ "$REF" != "refs/heads/main" ]; then
                echo "FAIL: a push triggered CI on '$REF'. The policy is pushes to main;"
                echo "      check the 'on: push: branches:' list in this file."
                exit 1
              fi
              ;;
            pull_request)
              if [ "$BASE_REF" != "main" ]; then
                echo "FAIL: a pull_request targeting '$BASE_REF' triggered CI."
                echo "      The policy is pull requests targeting main."
                exit 1
              fi
              ;;
            schedule)
              if [ "$REF" != "refs/heads/main" ]; then
                echo "FAIL: the weekly full-suite run executed '$REF', not main."
                echo "      Its Postgres and Playwright results would be cited as"
                echo "      evidence about main while testing something else."
                exit 1
              fi
              echo "cadence OK: scheduled full-suite run on $REF"
              ;;
            workflow_dispatch)
              echo "cadence OK: manual dispatch on $REF (full_suite=${FULL_SUITE:-false})"
              if [ "$REF" != "refs/heads/main" ]; then
                echo "::notice::This run certifies '$REF', not main. Do not read its"
                echo "  Postgres/e2e results as evidence about main."
              fi
              ;;
            *)
              echo "FAIL: unexpected event '$EVENT' — this workflow's triggers changed"
              echo "      without the policy job being told about it."
              exit 1
              ;;
          esac

  guard:
    needs: policy
    runs-on: ubuntu-latest
    # Bounded so a wedged service container fails the job in minutes instead
    # of eating GitHub's 360-minute default and reading as "still running".
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Secret guard (tracked files only)
        run: python scripts/check_secrets.py
      - name: Validate compose and environment template
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-not-a-real-secret
          APP_DB_PASSWORD: ci-not-a-real-secret
          REDIS_PASSWORD: ci-not-a-real-secret
          KEYCLOAK_ADMIN_PASSWORD: ci-not-a-real-secret
          SERVICE_CLIENT_SECRET: ci-not-a-real-secret
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci-not-a-real-secret
        run: |
          test -f .env.example
          grep -q SERVICE_CLIENT_SECRET .env.example
          cp .env.example .env
          docker compose config > /dev/null
          # The refs compose would actually pull, in the log. `config` only
          # interpolates — it never contacts a registry — so printing the
          # resolved image names is the cheapest way to see a bad digest.
          docker compose config --images
      - name: Images are digest-pinned
        # Deliberately runs with the `.env` from the step above still present.
        # Deleting it first put this gate into "structural check only" mode,
        # which is how every compose service could default to a zero digest
        # that no registry has and still report success on every push.
        run: |
          python scripts/pin_digests.py --check
          rm -f .env
      - name: CI gates can still fail
        # Regex-only, no third-party imports: this job deliberately has no
        # dependency install, because a gate that needs its dependencies
        # installed to check the dependencies is a weak gate.
        run: python scripts/check_ci_consistency.py --check

  docs:
    needs: policy
    runs-on: ubuntu-latest
    # Bounded so a wedged service container fails the job in minutes instead
    # of eating GitHub's 360-minute default and reading as "still running".
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Required documentation present
        run: |
          for f in README.md LICENSE SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md CHANGELOG.md .env.example docker-compose.yml mkdocs.yml docs/BRAIN.md docs/README.md docs/glossary.md docs/00-plan/ROADMAP.md; do test -f "$f" || (echo "missing $f" && exit 1); done
          echo "docs gate OK"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Documentation link check
        run: python scripts/verify_doc_links.py
      - name: Encoding check
        run: python scripts/check_mojibake.py
      - name: Install dependencies for doc-count verification
        run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Documentation counts match code reality
        run: python scripts/doc_counts.py --check

  backend:
    needs: policy
    runs-on: ubuntu-latest
    # Bounded so a wedged service container fails the job in minutes instead
    # of eating GitHub's 360-minute default and reading as "still running".
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install backend dependencies and linters
        run: |
          pip install -r backend/requirements.txt
          pip install ruff mypy pip-audit
      - name: Backend lint (Ruff)
        # Every check below runs the Makefile target rather than a copy of the
        # command. The two had already drifted: `make test-worker` omitted the
        # Redis URL that this workflow passed, so four worker tests skipped
        # locally while passing in CI, and a green `make test` meant something
        # different from a green CI run.
        run: make lint-backend
      - name: Backend typecheck (Mypy)
        run: make typecheck-backend
      - name: Backend dependency audit (pip-audit, strict)
        run: make audit-python REQUIREMENTS=backend/requirements.txt
      - name: Palette contrast and token audit
        run: python frontend/check_palette_layer.py
      - name: Migration chain is linear
        run: python scripts/audit_migrations.py
      - name: Backend test suite (pytest, SQLite fast tier)
        run: make test-backend
      - name: API contract synchronization (OpenAPI matches committed copy)
        # Both committed copies of the contract are regenerated from the same
        # `app.openapi()` call and diffed. The YAML copy used to be ungated,
        # so it drifted: 80 of its 84 paths disagreed with the contract the
        # server actually serves, and nothing noticed.
        run: |
          pip install pyyaml==6.0.3
          python scripts/generate_openapi.py
          git diff --exit-code -- api/openapi.json api/openapi.yaml || (
            echo "the committed OpenAPI contract is stale - run 'python scripts/generate_openapi.py' and commit" && exit 1
          )

  worker:
    needs: policy
    runs-on: ubuntu-latest
    # Bounded so a wedged service container fails the job in minutes instead
    # of eating GitHub's 360-minute default and reading as "still running".
    timeout-minutes: 20
    services:
      # The worker talks to Redis for real — queue promotion, job execution.
      # Four tests in `worker/tests/test_worker.py` skip without a live Redis,
      # so without this service they had never run anywhere.
      redis:
        # Digest-pinned: `scripts/pin_digests.py --check` enforces this.
        image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install worker dependencies
        run: |
          pip install -r worker/requirements.txt
          pip install pytest ruff pip-audit
      - name: Worker lint
        run: make lint-worker
      - name: Worker dependency audit (pip-audit, strict)
        run: make audit-python REQUIREMENTS=worker/requirements.txt
      - name: Worker unit tests
        env:
          RQ_TEST_REDIS_URL: redis://localhost:6379/0
          REDIS_URL: redis://localhost:6379/0
          # Passed through to the Makefile target, which runs the same command
          # locally. That indirection is the fix: the target used to omit these
          # two variables, so four tests skipped for everyone running `make`
          # while CI ran them, and neither side knew the other disagreed.
          STRICT: "1"
        # STRICT=1 means "nothing may skip": these four tests skipped silently
        # for a long time, which is how the scheduler that crashes on boot stayed
        # in the tree. 38 is the whole worker suite, and the Redis service above
        # means all 38 are expected to run.
        run: make test-worker

  frontend:
    needs: policy
    runs-on: ubuntu-latest
    # Bounded so a wedged service container fails the job in minutes instead
    # of eating GitHub's 360-minute default and reading as "still running".
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: vantor
      NEXT_PUBLIC_KEYCLOAK_CLIENT: vantor-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck
        run: make typecheck-frontend
      - name: Frontend lint
        run: make lint-frontend
      - name: Frontend dependency audit (production deps, high+)
        run: make audit-js
      - name: Frontend unit/component tests
        run: make test-frontend
      - name: Production build (Next.js)
        run: make build-frontend

  # -------------------------------------------------------------------------
  # The images the project ships.
  #
  # No CI job built a Dockerfile — ever. The `release` workflow publishes a
  # GitHub release and never touches Docker, so the repository's primary
  # delivery artefact — the container image — was built by nobody, ever, and
  # a broken Dockerfile could reach `main` without a single test noticing.
  #
  # That is how `COPY . .` overwriting the container's `npm ci` install with
  # the developer's own `node_modules` survived: the image was never built, so
  # the image was never wrong in a way anyone could see.
  #
  # The three Python images are built on every push. They are quick (one
  # `pip install` each) and they catch the failures that actually happen: a
  # base image that no longer resolves, a requirements file that cannot be
  # installed, a Dockerfile that no longer parses.
  #
  # The two Node images are much slower — each runs a full `npm ci` and a
  # production `next build` — so they are built on the weekly schedule and on
  # a manual `full_suite: true` dispatch instead of on every push.
  # -------------------------------------------------------------------------
  images:
    needs: policy
    runs-on: ubuntu-latest
    # Bounded so a wedged service container fails the job in minutes instead
    # of eating GitHub's 360-minute default and reading as "still running".
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Every pin resolves at its registry
        # Metadata GETs, not pulls: this proves `docker compose up` can resolve
        # each digest it names without downloading gigabytes. Drift is a warning
        # (pinning is the point); an unresolvable pin fails the step. Runs here
        # rather than on every push because it needs the network and the answer
        # changes with upstream, not with this repo.
        run: python scripts/pin_digests.py --verify-remote
      - name: Build the backend image
        run: docker build -t vantor-backend:ci -f backend/Dockerfile backend
      - name: Build the worker image
        run: docker build -t vantor-worker:ci -f worker/Dockerfile worker
      - name: Build the Keycloak provisioning image
        run: docker build -t vantor-keycloak:ci -f deploy/keycloak/Dockerfile deploy/keycloak
      - name: Build the frontend image the way compose builds it
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.full_suite == 'true') || github.event_name == 'schedule' }}
        # Built through `docker compose build`, not a hand-written `docker build`
        # that repeats the args — repeating them here would test CI's copy of the
        # configuration instead of the file users actually read. The bundle is
        # then inspected because a build-time fallback of `http://localhost:8000`
        # is invisible until every API call from another host fails: the compose
        # stack shipped that way with a green pipeline.
        run: |
          cp .env.example .env
          docker compose build frontend
          docker run --rm --entrypoint sh vantor-frontend -c '
            set -e
            test -f .next/routes-manifest.json || { echo "FAIL: no routes-manifest.json in the image"; exit 1; }
            if grep -rq "http://localhost:8000" .next/static 2>/dev/null; then
              echo "FAIL: the web bundle baked a build-machine API address."
              echo "      NEXT_PUBLIC_API_URL must reach the build as an arg,"
              echo "      and "" (same-origin) is the value compose passes."
              exit 1
            fi
            grep -q "/api/:path*" .next/routes-manifest.json || {
              echo "FAIL: no same-origin /api rewrite — INTERNAL_API_URL was not set at build time"; exit 1; }
            echo "OK: no baked localhost API address, and the /api rewrite is present"
          '
          rm -f .env
      - name: Build the frontend image with no args (developer default)
        run: docker build -t vantor-frontend:ci -f frontend/Dockerfile frontend
      - name: Build the single-container image
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.full_suite == 'true') || github.event_name == 'schedule' }}
        run: docker build -t vantor:ci -f Dockerfile .

  # =========================================================================
  # Heavy Expansion Tier (Enabled via workflow_dispatch with full_suite=true,
  # or un-commented when moving to full-scale PR/commit CI in a later phase)
  # =========================================================================
  postgres-tier:
    needs: [backend]
    # Manual dispatch with full_suite=true, or the weekly scheduled run. This
    # tier used to be dispatch-only, and the one time it was dispatched it
    # failed — so the RLS, foreign-key and concurrency assertions had never
    # passed anywhere.
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.full_suite == 'true') || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    # Bounded so a wedged service container fails the job in minutes instead
    # of eating GitHub's 360-minute default and reading as "still running".
    timeout-minutes: 30
    services:
      postgres:
        # Digest-pinned: `scripts/pin_digests.py --check` enforces this.
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: vantor
          POSTGRES_PASSWORD: vantor-test
          POSTGRES_DB: vantor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vantor"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Alembic baseline check on real Postgres
        env:
          DATABASE_URL: postgresql://vantor:vantor-test@localhost:5432/vantor_test
          APP_DB_PASSWORD: ci-app-role-test-pw
        run: |
          cd backend
          alembic upgrade head
          alembic check
          alembic downgrade -1
          alembic upgrade head
      - name: Postgres-backed tests (concurrency, RLS, FKs)
        env:
          APP_ENV: test
          PG_TEST_DATABASE_URL: postgresql://vantor:vantor-test@localhost:5432/vantor_test
          APP_DB_PASSWORD: ci-app-role-test-pw
          OIDC_ISSUER: https://issuer.test/realms/vantor
          JWT_AUDIENCE: vantor-web
        # Two separate holes, one target. `require_postgres()` now fails rather
        # than skipping when the URL is set but the database is unreachable, so
        # a dead service container reddens the job instead of turning it green by
        # omission; and run_tier.py refuses to certify the tier if anything
        # skipped or fewer than the 11 pg-marked tests passed, which also covers
        # a lost `pg` marker selecting nothing. The same target is what
        # `make test-pg` runs locally, so nobody has to guess what CI did.
        run: make test-pg

  e2e-tier:
    needs: [frontend, backend]
    # Same trigger as the Postgres tier: manual full-suite dispatch, or the
    # weekly schedule. The Playwright suite had never run green in CI.
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.full_suite == 'true') || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    # Bounded so a wedged service container fails the job in minutes instead
    # of eating GitHub's 360-minute default and reading as "still running".
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Start API server in local mode
        env:
          APP_ENV: development
          AUTH_MODE: local
          DATABASE_URL: "sqlite:///./data/ci_e2e.db"
          LOCAL_KEY_PATH: "./data/ci_e2e_key.pem"
        run: |
          cd backend
          mkdir -p data
          nohup python -m uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/v1/health || (cat /tmp/backend.log && exit 1)
      - name: Install Playwright browsers and run E2E
        run: |
          npm --prefix frontend ci
          # npx resolves from the current directory's node_modules, so this has
          # to happen inside frontend/ — there is no `npx --prefix`.
          cd frontend && npx playwright install --with-deps chromium && cd ..
          # `make test-e2e`, the same target a developer runs. It requires five
          # passing tests: the tier has exactly five, so a skip anywhere in it
          # drops the count below the requirement and reddens the job rather than
          # passing on an empty run.
          NEXT_PUBLIC_API_URL=http://localhost:8000 make test-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
