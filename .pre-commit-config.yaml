# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(lock|min\.js|svg)$'
      - id: end-of-file-fixer
        exclude: '\.(lock|min\.js|svg)$'
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(backend|worker)/
      - id: ruff-format
        files: ^(backend|worker)/

  - repo: local
    hooks:
      - id: check-secrets
        name: Secret Scan
        entry: python scripts/check_secrets.py
        language: system
        pass_filenames: false
      - id: check-mojibake
        name: UTF-8 / Mojibake Check
        entry: python scripts/check_mojibake.py
        language: system
        pass_filenames: false
      - id: verify-brain-links
        name: Brain Link Verification
        entry: python scripts/verify_brain_links.py
        language: system
        pass_filenames: false
