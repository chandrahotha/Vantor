[pytest]
# The `pg` marker is how the PostgreSQL tier is selected. It was used by
# `tests/test_pg_infrastructure.py` and by CI but declared nowhere, so pytest
# emitted `PytestUnknownMarkWarning` and `-m pg` worked only by accident of
# string matching. Registering it here makes `pytest -m "not pg"` a supported way
# to run the fast tier and makes the marker visible in `--markers`.
markers =
    pg: requires a real PostgreSQL (PG_TEST_DATABASE_URL); builds the schema with alembic
    slow: takes more than a second
addopts = -ra --strict-markers
testpaths = tests
filterwarnings =
    error::DeprecationWarning:app.*
