# Vantor local free stack. No paid services required.
# Usage: Copy-Item .env.example .env; docker compose up -d
name: vantor

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vantor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
      POSTGRES_DB: ${POSTGRES_DB:-vantor}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vantor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional services, behind profiles so `docker compose up -d` stays light and
  # offline-friendly. Enable them explicitly:
  #   docker compose --profile ai up -d ollama       # local models for AI + embeddings
  #   docker compose --profile storage up -d minio  # S3-compatible object storage
  # Nothing in the default stack depends on either. `.env.example` therefore
  # ships AI_PROVIDER=disabled and EMBEDDING_PROVIDER=disabled, so a fresh clone
  # is honest (UNKNOWN, keyword search) rather than broken (connection refused).
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc --version >/dev/null 2>&1 && mc ready local || curl -sf http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_USERNAME: ${POSTGRES_USER:-vantor}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin-change-me
      # Note: default schema is public; set KC_DB_SCHEMA only after creating it.
      # KC_DB_SCHEMA: keycloak
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ["ai"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # After starting: docker exec vantor-ollama-1 ollama pull llama3.1:8b
    #                 docker exec vantor-ollama-1 ollama pull nomic-embed-text
    # Then set AI_PROVIDER=ollama (and EMBEDDING_PROVIDER=ollama for real vectors)
    # in .env and restart the backend.

  # Phase 3 Foundation live. Frontend/worker land in Phase 4/7.
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  frontend:
    build: ./frontend
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [backend, keycloak]
  worker:
    build: ./worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
  # Scheduled jobs (RQ scheduler): contract expiry roll daily, spend snapshot
  # hourly. Without this the jobs existed only as a manual CLI.
  beat:
    build: ./worker
    env_file: .env
    command: ["python", "beat.py"]
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-data:
