<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Checking session</title>
    <script>
      // Keycloak's `prompt=none` silent SSO probe is loaded into this page
      // inside a hidden iframe. The adapter is listening on the opener window
      // for a message whose origin is this one, carrying the full callback URL
      // so it can extract the code (or `login_required`).
      //
      // This page must never render UI, and must never navigate the opener.
      parent.postMessage(window.location.href, window.location.origin);
    </script>
  </head>
  <body></body>
</html>
