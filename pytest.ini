# Alembic.ini is minimal; pytest.ini is the canonical place for test config.
# The plugins live in `backend/tests/conftest.py`; this file is there so the
# markers are registered once and the suite keeps collecting cleanly.
[pytest]
markers =
    pg: tests that must run against real Postgres (RLS + FKs + alembic checked)
testpaths = backend/tests
pythonpath = backend tests
asyncio_mode = auto
